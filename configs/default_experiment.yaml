# configs/default_experiment.yaml
seed: 42
target_fpr: 0.01
output_dir: "output"

# Global data sample sizes (-1 indicates 100% full dataset, no subsampling)
train_sample_size: -1
dev_sample_size: -1

# Granular configuration per model and per scope
models:
  # =========================================================================
  # 1. LINEAR SVM (TF-IDF + Stylometrics)
  # =========================================================================
  svm:
    full:
      tune: true
      n_trials: 25
      tuning_sample_size: 20000     # Well-balanced stratified subsample for fast 3-fold CV
    sentence:
      tune: true
      n_trials: 30
      tuning_sample_size: 40000     # Subsample balancing sentence diversity

  # =========================================================================
  # 2. mDeBERTa-v3 (CVaR-DRO)
  # =========================================================================
  mdeberta:
    full:
      tune: true
      n_trials: 15
      tuning_sample_size: 6000      
      val_sample_size: -1           # Full Dev split
      epochs: 4                     # Max ceiling: early stopping will halt at the true peak
      learning_rate: 2.0e-5
      max_length: 384              
      batch_size: 8               
      gradient_accumulation_steps: 4 
    sentence:
      tune: true
      n_trials: 15
      tuning_sample_size: 12000     
      val_sample_size: -1           # Full Dev split
      epochs: 4                     # Max ceiling: early stopping will halt at the true peak
      learning_rate: 3.0e-5
      max_length: 128               
      batch_size: 32               
      gradient_accumulation_steps: 1

  # =========================================================================
  # 3. Fast-DetectGPT (Zero-Shot)
  # =========================================================================
  fdgpt:
    full:
      batch_size: 8                
      max_length: 384
    sentence:
      batch_size: 32               
      max_length: 128

  # =========================================================================
  # 4. Statistical Trajectory
  # =========================================================================
  stat_trajectory:
    full:
      sample_size: -1               # Full train split
    sentence:
      sample_size: -1               # Full train split