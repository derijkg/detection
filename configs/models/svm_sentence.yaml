# configs/models/svm_sentence.yaml

model:
  name: "svm"
  granularity: "sentence"   # Standardized to 'sentence'
  use_stylometrics: true
  calibrate: true

training:
  output_dir: "outputs/checkpoints/svm_sentence"
  train_sample_size: -1

  # FIXED TF-IDF PARAMETERS FROM EXTRACTED SENTENCE JSON
  word_min_ngram: 1
  word_max_ngram: 1
  word_max_features: 10000
  word_min_df: 1
  word_max_df: 0.982572
  word_binary: true
  word_sublinear_tf: true

  char_min_ngram: 3
  char_max_ngram: 3
  char_max_features: 20000
  char_min_df: 1
  char_max_df: 0.986664
  char_binary: true
  char_sublinear_tf: true

  # DEFAULT CLASSIFIER PARAMETERS
  kernel: "linear"
  C: 0.038778
  linear_loss: "squared_hinge"
  class_weight: "balanced"
  sty_weight: 0.05

optuna:
  n_trials: 30
  output_dir: "outputs/metrics/svm_sentence_optuna"
  tune_sample_size: 9000
  score_metric: "pauc"
  max_fpr: 0.01

  # TRIAL #0: Enqueue initial warmstart trial parameters
  enqueue_params:
    C: 0.038778
    kernel: "linear"
    weight_mode: "balanced"
    sty_weight: 0.05

  search_space:
    C: [0.001, 5.0]
    kernel: ["linear"]
    weight_mode: ["balanced", "custom"]
    human_class_weight: [0.5, 20.0]
    sty_weight: [0.0001, 1.0]

eval:
  save_dir: "outputs/metrics/svm_sentence"
  batch_size: 256