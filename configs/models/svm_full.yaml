model:
  name: "svm"
  granularity: "full"
  use_stylometrics: true
  calibrate: true

training:
  output_dir: "outputs/checkpoints/svm_full"
  train_sample_size: -1

  # FIXED TF-IDF PARAMETERS (Always used during training & tuning)
  word_min_ngram: 1
  word_max_ngram: 4
  word_max_features: 30000
  word_min_df: 5
  word_max_df: 0.873586
  word_binary: true
  word_sublinear_tf: false

  char_min_ngram: 3
  char_max_ngram: 6
  char_max_features: 40000
  char_min_df: 4
  char_max_df: 0.885702
  char_binary: true
  char_sublinear_tf: false

  # DEFAULT CLASSIFIER PARAMETERS
  kernel: "linear"
  C: 1.546418
  linear_loss: "squared_hinge"
  class_weight: "custom"
  human_class_weight: 2.991025
  sty_weight: 0.05

optuna:
  n_trials: 30
  output_dir: "outputs/metrics/svm_full_optuna"
  tune_sample_size: 3000
  score_metric: "pauc"
  max_fpr: 0.01

  # TRIAL #0: Enqueue these exact parameters first
  enqueue_params:
    C: 1.546418
    kernel: "linear"
    weight_mode: "custom"
    human_class_weight: 2.991025
    sty_weight: 0.05

  search_space:
    C: [0.01, 15.0]
    kernel: ["linear"]
    weight_mode: ["balanced", "custom"]
    human_class_weight: [0.5, 20.0]
    sty_weight: [0.001, 2.0]

eval:
  save_dir: "outputs/metrics/svm_full"
  batch_size: 256