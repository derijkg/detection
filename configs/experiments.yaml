# configs/experiments.yaml
# =========================================================================
# GLOBAL SETTINGS
# =========================================================================
seed: 42
target_fpr: 0.01
output_dir: "output"

# =========================================================================
# 1. REUSABLE DATA RECIPES
# =========================================================================
data_recipes:
  # Standard Document-level Split
  standard_full_train:
    splits: ["train"]
    include_full_abstracts: true
    include_standard_sentences: false
    include_full_abstract_sentences: false

  standard_full_dev:
    splits: ["dev"]
    include_full_abstracts: true
    include_standard_sentences: false
    include_full_abstract_sentences: false

  # Standard Sentence-level Split
  standard_sentence_train:
    splits: ["train"]
    include_full_abstracts: false
    include_standard_sentences: true
    include_full_abstract_sentences: false

  standard_sentence_dev:
    splits: ["dev"]
    include_full_abstracts: false
    include_standard_sentences: true
    include_full_abstract_sentences: false

  # Augmented Sentence Split (Standard Sentences + Full AI Abstract Sentences)
  augmented_sentence_train:
    splits: ["train"]
    include_full_abstracts: false
    include_standard_sentences: true
    include_full_abstract_sentences: true

  augmented_sentence_dev:
    splits: ["dev"]
    include_full_abstracts: false
    include_standard_sentences: true
    include_full_abstract_sentences: true

  # Multi-Scale Joint Split (Full Abstracts + All Sentences)
  multiscale_joint_train:
    splits: ["train"]
    include_full_abstracts: true
    include_standard_sentences: true
    include_full_abstract_sentences: true

  multiscale_joint_dev:
    splits: ["dev"]
    include_full_abstracts: true
    include_standard_sentences: true
    include_full_abstract_sentences: true

# =========================================================================
# 2. EXPERIMENTS (Baselines & Custom Runs)
# =========================================================================
experiments:
  # -----------------------------------------------------------------------
  # A. LINEAR SVM EXPERIMENTS
  # -----------------------------------------------------------------------
  - name: "svm_full_baseline"
    model: "svm"
    scope: "full"
    train_recipe: "standard_full_train"
    dev_recipe: "standard_full_dev"
    eval_benchmarks: ["full"]
    tuning:
      enabled: true
      n_trials: 40
      sample_size: -1

  - name: "svm_sentence_baseline"
    model: "svm"
    scope: "sentence"
    train_recipe: "standard_sentence_train"
    dev_recipe: "standard_sentence_dev"
    eval_benchmarks: ["sentence"]
    tuning:
      enabled: true
      n_trials: 40
      sample_size: 75000

  - name: "svm_sentence_augmented"
    model: "svm"
    scope: "sentence"
    train_recipe: "augmented_sentence_train"
    dev_recipe: "augmented_sentence_dev"
    eval_benchmarks: ["sentence"]
    tuning:
      enabled: true
      n_trials: 50
      sample_size: 100000

  # -----------------------------------------------------------------------
  # B. mDeBERTa-v3 (CVaR-DRO) EXPERIMENTS
  # -----------------------------------------------------------------------
  - name: "deberta_full_baseline"
    model: "mdeberta"
    scope: "full"
    train_recipe: "standard_full_train"
    dev_recipe: "standard_full_dev"
    eval_benchmarks: ["full"]
    hyperparams:
      max_length: 512
      batch_size: 8
      gradient_accumulation_steps: 4
      learning_rate: 2.0e-5
      epochs: 4
    tuning:
      enabled: true
      n_trials: 15
      sample_size: 8000

  - name: "deberta_sentence_baseline"
    model: "mdeberta"
    scope: "sentence"
    train_recipe: "standard_sentence_train"
    dev_recipe: "standard_sentence_dev"
    eval_benchmarks: ["sentence"]
    hyperparams:
      max_length: 96
      batch_size: 32
      gradient_accumulation_steps: 1
      learning_rate: 3.0e-5
      epochs: 4
    tuning:
      enabled: true
      n_trials: 15
      sample_size: 18000

  - name: "deberta_sentence_augmented"
    model: "mdeberta"
    scope: "sentence"
    train_recipe: "augmented_sentence_train"
    dev_recipe: "augmented_sentence_dev"
    eval_benchmarks: ["sentence"]
    hyperparams:
      max_length: 96
      batch_size: 32
      gradient_accumulation_steps: 1
      learning_rate: 3.0e-5
      epochs: 4
    tuning:
      enabled: true
      n_trials: 15
      sample_size: 24000

  - name: "deberta_multiscale_joint"
    model: "mdeberta"
    scope: "mixed"
    train_recipe: "multiscale_joint_train"
    dev_recipe: "multiscale_joint_dev"
    eval_benchmarks: ["sentence", "full"]
    hyperparams:
      max_length: 512
      batch_size: 16
      gradient_accumulation_steps: 2
      learning_rate: 2.5e-5
      epochs: 4
      w_doc: 1.0
      w_sent: 1.0
      lambda_neg: 2.5
    tuning:
      enabled: true
      n_trials: 15
      sample_size: 20000

  # -----------------------------------------------------------------------
  # C. ZERO-SHOT & STATISTICAL DETECTORS
  # -----------------------------------------------------------------------
  - name: "fdgpt_full_baseline"
    model: "fdgpt"
    scope: "full"
    train_recipe: "standard_full_train"
    dev_recipe: "standard_full_dev"
    eval_benchmarks: ["full"]
    hyperparams:
      batch_size: 8
      max_length: 512

  - name: "fdgpt_sentence_baseline"
    model: "fdgpt"
    scope: "sentence"
    train_recipe: "standard_sentence_train"
    dev_recipe: "standard_sentence_dev"
    eval_benchmarks: ["sentence"]
    hyperparams:
      batch_size: 32
      max_length: 96

  - name: "stat_trajectory_full"
    model: "stat_trajectory"
    scope: "full"
    train_recipe: "standard_full_train"
    dev_recipe: "standard_full_dev"
    eval_benchmarks: ["full"]

  - name: "stat_trajectory_sentence"
    model: "stat_trajectory"
    scope: "sentence"
    train_recipe: "standard_sentence_train"
    dev_recipe: "standard_sentence_dev"
    eval_benchmarks: ["sentence"]